name: obatku
description: >-
  Sistem Manajemen Stok Obat Offline-First untuk Puskesmas & Daerah 3T Indonesia.
  Aplikasi mobile inventaris dan logistik farmasi berprinsip offline-first
  dengan kecerdasan prediktif tepi (Edge AI).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local Database (SQLite)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Charts & Visualization
  fl_chart: ^0.68.0

  # Barcode Scanner
  mobile_scanner: ^5.1.1

  # CSV Export
  csv: ^6.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: ^9.0.0

  # Localization & Formatting
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3

  # Local Notifications
  flutter_local_notifications: ^17.2.1+2

  # UI Helpers
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
